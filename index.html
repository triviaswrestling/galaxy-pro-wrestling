<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Galaxy Pro Wrestling</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ENCABEZADO SUPERIOR -->
    <header class="top-banner">
        <div class="logo-container">
            <h1>Galaxy Pro Wrestling</h1>
            <div class="event-sub">GPW: GALACTIC CLASH | SÁBADO 19 OCT</div>
        </div>
    </header>

    <!-- PRESENTACIÓN DE INSTAGRAM -->
    <div class="instagram-section">
        <div class="ig-header">
            <div class="ig-user-info">
                <div class="ig-avatar">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="ig-names">
                    <h3>@GalaxyProWrestling</h3>
                    <p>La Evolución de la Lucha</p>
                </div>
            </div>
            <a href="https://instagram.com/tu_usuario" target="_blank" class="ig-btn">Seguir</a>
        </div>
        <div class="ig-preview-grid">
            <img src="https://images.unsplash.com/photo-1566393028674-d1912e42337d?w=300" alt="Post IG 1" class="ig-thumb">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300" alt="Post IG 2" class="ig-thumb">
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=300" alt="Post IG 3" class="ig-thumb">
        </div>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <main class="menu-container">
        
        <a href="eventos.html" class="menu-card">
            <div class="card-img-container">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600" alt="Eventos">
            </div>
            <div class="card-content">
                <h2>EVENTOS</h2>
                <p>Próximos Shows • Carteleras</p>
            </div>
        </a>

        <a href="luchadores.html" class="menu-card">
            <div class="card-img-container">
                <img src="https://images.unsplash.com/photo-1566393028674-d1912e42337d?w=600" alt="Luchadores">
            </div>
            <div class="card-content">
                <h2>LUCHADORES</h2>
                <p>Elenco Estelar • Superstars</p>
            </div>
        </a>

        <a href="multimedia.html" class="menu-card">
            <div class="card-img-container">
                <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=600" alt="Multimedia">
            </div>
            <div class="card-content">
                <h2>MULTIMEDIA</h2>
                <p>Clips • Reps • Fotos</p>
            </div>
        </a>

        <a href="rankings.html" class="menu-card">
            <div class="card-img-container">
                <img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=600" alt="Rankings">
            </div>
            <div class="card-content">
                <h2>RANKINGS</h2>
                <p>Top 10 • Campeones Actuales</p>
            </div>
        </a>

    </main>

    <script src="script.js"></script>
</body>
</html>
