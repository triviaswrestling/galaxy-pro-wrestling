<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Ranking - Galaxy Pro Wrestling</title>
    
    <!-- Fuentes e Íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="wrestlercard.css">
    <link rel="stylesheet" href="ranking.css">
</head>
<body>

    <div class="glow-border left"></div>
    <div class="glow-border right"></div>

    <header class="main-header"></header>

    <main>
        <!-- Banner de Encabezado: Imagen WebP + Título Ranking (Responsive Mobile/PC) -->
        <section class="ranking-header-banner">
            <div class="ranking-banner-img-container">
                <img src="img/ranking_banner.webp" alt="GPW Ranking Banner" class="ranking-banner-img">
            </div>
            <div class="ranking-banner-title">
                <h2><i class="fa-solid fa-trophy text-cyan"></i> OFFICIAL <span class="text-cyan">RANKING</span></h2>
            </div>
        </section>

        <!-- Grilla de Cards minimalistas (3 cols en Mobile / 4 en PC) -->
        <div id="ranking-grid" class="ranking-grid"></div>
    </main>

    <!-- MODAL EXCLUSIVO DE RANKING -->
    <div id="ranking-modal" class="modal">
        <div class="modal-content ranking-modal-content">
            <button class="close-button" onclick="closeRankingModal()">×</button>

            <!-- 1. Puesto y División -->
            <div class="modal-rank-top">
                <span id="modal-rank-num" class="rank-title-badge">#1</span>
                <span id="modal-division" class="modal-division-text">MASCULINO</span>
            </div>

            <!-- 2. Perfil: Foto + Nombre + Intérprete -->
            <div class="modal-profile-header">
                <img id="modal-img" src="" alt="Luchador">
                <div class="modal-profile-info">
                    <h2 id="modal-name">Nombre</h2>
                    <p class="interpreter-line">INTÉRPRETE: <span id="modal-interpreter" class="interpreter"></span></p>
                    <div class="overall-badge">
                        OVERALL: <span id="val-overall">0</span>
                    </div>
                </div>
            </div>

            <!-- 3. Subtítulo de Atributos -->
            <div class="modal-highlights-header">
                <h3>ATRIBUTOS DE COMBATE Y MANEJO</h3>
            </div>

            <!-- 4. Barras de habilidades neón (Micro, Charisma, Power) -->
            <div class="stats-bars-wrapper">
                <div class="stat-row">
                    <div class="stat-labels">
                        <span>MICRO</span>
                        <span id="val-micro" class="stat-val-micro">0</span>
                    </div>
                    <div class="stat-bar-container">
                        <div id="bar-micro" class="stat-bar-fill bar-micro" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-labels">
                        <span>CHARISMA</span>
                        <span id="val-charisma" class="stat-val-charisma">0</span>
                    </div>
                    <div class="stat-bar-container">
                        <div id="bar-charisma" class="stat-bar-fill bar-charisma" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-labels">
                        <span>POWER</span>
                        <span id="val-power" class="stat-val-power">0</span>
                    </div>
                    <div class="stat-bar-container">
                        <div id="bar-power" class="stat-bar-fill bar-power" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- 5. Logros -->
            <div class="modal-highlights-header">
                <h3>ACCOLADES & LOGROS</h3>
            </div>
            <ul id="modal-achievements" class="ranking-achievements-list"></ul>

        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="js/wrestlers.js"></script>
    <script src="js/ranking.js"></script>
</body>
</html>
